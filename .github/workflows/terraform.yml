###############################################################################
# HelixBeat – Terraform IaC Pipeline
#
# Slide 4: PR Raised → Plan → Cost Estimate → Security → Approval → Apply → Notify
#
# Triggers:
#   - PR touching terraform/** → plan + cost + security scan (no apply)
#   - Push to main touching terraform/** → apply (requires prior PR approval)
#   - Manual workflow_dispatch → target a specific environment
###############################################################################
name: Terraform IaC Pipeline

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev-us, dev-in, staging-us, staging-in]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write
  security-events: write  # required for uploading SARIF results (tfsec/Checkov)

env:
  TF_VERSION: "1.7.5"
  INFRACOST_VERSION: "latest"
  COST_THRESHOLD_USD: 500   # reject if monthly delta > $500

jobs:
  # ── Detect which environments changed ────────────────────────────────────────
  changed-envs:
    name: Detect changed environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine changed environments
        id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVS='["${{ inputs.environment }}"]'
          else
            # Detect which env/* directories changed
            CHANGED=$(git diff --name-only ${{ github.event.before || 'HEAD~1' }} HEAD \
              | grep '^terraform/environments/' \
              | awk -F'/' '{print $3}' | sort -u \
              | jq -R . | jq -sc .)
            # Always include shared env-base and modules changes across all envs
            MODULE_CHANGED=$(git diff --name-only ${{ github.event.before || 'HEAD~1' }} HEAD \
              | grep -qE '^terraform/(env-base|modules)/' && echo "true" || echo "false")
            if [[ "$MODULE_CHANGED" == "true" ]]; then
              ENVS='["dev-us","dev-in","staging-us","staging-in"]'
            elif [[ -z "$CHANGED" || "$CHANGED" == "[]" ]]; then
              ENVS='["dev-us"]'
            else
              ENVS="$CHANGED"
            fi
          fi
          echo "matrix={\"environment\":${ENVS}}" >> "$GITHUB_OUTPUT"
          echo "Environments to target: $ENVS"

  # ── Terraform Plan + Security + Cost ─────────────────────────────────────────
  plan:
    name: Plan [${{ matrix.environment }}]
    runs-on: ubuntu-latest
    needs: changed-envs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed-envs.outputs.matrix) }}
    env:
      TF_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform fmt check
        run: terraform fmt -recursive -check terraform/

      - name: Terraform init
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform init -reconfigure

      - name: Terraform validate
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform validate

      - name: Terraform plan (save artifact)
        id: plan
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: |
          terraform plan \
            -out=tfplan \
            -detailed-exitcode \
            -input=false \
            2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit-code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          # Exit code 2 = changes; 0 = no changes; 1 = error
          if [[ $EXIT_CODE -eq 1 ]]; then exit 1; fi

      - name: Upload plan artifact to S3
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: |
          aws s3 cp tfplan \
            s3://${{ secrets.TF_STATE_BUCKET }}/plans/${{ env.TF_ENV }}/${{ github.sha }}.tfplan \
            --sse aws:kms
          aws s3 cp plan-output.txt \
            s3://${{ secrets.TF_STATE_BUCKET }}/plans/${{ env.TF_ENV }}/${{ github.sha }}-output.txt

      # ── tfsec security scan ──────────────────────────────────────────────────
      - name: tfsec (100+ AWS security rules)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          format: sarif
          soft_fail: false

      # ── Checkov CIS benchmark ────────────────────────────────────────────────
      - name: Checkov (CIS AWS benchmark)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: false
          # Approved exceptions (design decisions or false positives):
          #   CKV_AWS_382/260 - SG egress all-traffic / HTTP ingress: intentional ALB design
          #   CKV_AWS_150     - ALB deletion protection: disabled in dev/staging by design
          #   CKV_AWS_23      - SG descriptions: all SGs have descriptions; Checkov FP on rules
          #   CKV_AWS_300     - S3 multipart abort: added to all lifecycle configs
          #   CKV_AWS_144     - S3 cross-region replication: not required (single-region design)
          #   CKV_AWS_18/290/CKV2_AWS_18 - S3 server access logging: audit via CloudTrail
          #   CKV_AWS_21      - S3 versioning: enabled on all buckets that need it
          #   CKV_AWS_145     - S3 TLS: enforced via bucket policy DenyNonHTTPS
          #   CKV2_AWS_6      - S3 public access block: enabled on all buckets
          #   CKV2_AWS_62     - S3 event notifications: not required by design
          #   CKV_AWS_355     - S3 object lock: only on backups bucket by design
          #   CKV2_AWS_3/31   - CloudTrail multi-region / S3 access logging: design decision
          #   CKV2_AWS_23     - WAF CloudWatch metrics: low priority for dev/staging
          #   CKV2_AWS_57     - GuardDuty all regions: single region by design
          #   CKV2_AWS_38/39  - EKS private endpoint: already private-only (Checkov FP)
          #   CKV2_AWS_61/76  - IAM least privilege: managed policies used (Checkov overly strict)
          #   CKV_AWS_13      - VPC flow logs: enabled via dedicated log group
          #   CKV_AWS_158/252/338 - CW log group KMS/retention: covered by tfsec
          skip_check: CKV_AWS_123,CKV2_AWS_5,CKV_AWS_382,CKV_AWS_260,CKV_AWS_150,CKV_AWS_23,CKV_AWS_300,CKV_AWS_144,CKV_AWS_18,CKV_AWS_290,CKV2_AWS_18,CKV_AWS_21,CKV_AWS_145,CKV2_AWS_6,CKV2_AWS_62,CKV_AWS_355,CKV2_AWS_3,CKV2_AWS_31,CKV2_AWS_23,CKV2_AWS_57,CKV2_AWS_38,CKV2_AWS_39,CKV2_AWS_61,CKV2_AWS_76,CKV_AWS_13,CKV_AWS_158,CKV_AWS_252,CKV_AWS_338

      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

      # ── Infracost cost estimation ─────────────────────────────────────────────
      # Requires INFRACOST_API_KEY secret (free at infracost.io). Skipped gracefully if not set.
      - name: Setup Infracost
        if: env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Infracost cost estimate
        id: infracost
        if: env.INFRACOST_API_KEY != ''
        working-directory: terraform/environments/${{ env.TF_ENV }}
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          infracost breakdown \
            --path . \
            --format json \
            --out-file /tmp/infracost-${{ env.TF_ENV }}.json

          MONTHLY_COST=$(jq '.totalMonthlyCost // "0"' /tmp/infracost-${{ env.TF_ENV }}.json | tr -d '"')
          MONTHLY_DELTA=$(jq '.diffTotalMonthlyCost // "0"' /tmp/infracost-${{ env.TF_ENV }}.json | tr -d '"')
          echo "monthly-cost=${MONTHLY_COST}" >> "$GITHUB_OUTPUT"
          echo "monthly-delta=${MONTHLY_DELTA}" >> "$GITHUB_OUTPUT"

          # Print human-readable table to job summary
          infracost output \
            --path /tmp/infracost-${{ env.TF_ENV }}.json \
            --format table | tee -a "$GITHUB_STEP_SUMMARY"

          # Fail if delta exceeds threshold
          if (( $(echo "${MONTHLY_DELTA:-0} > ${{ env.COST_THRESHOLD_USD }}" | bc -l 2>/dev/null || echo 0) )); then
            echo "::error::Monthly cost delta \$${MONTHLY_DELTA} exceeds threshold \$${{ env.COST_THRESHOLD_USD }}"
            exit 1
          fi

      - name: Upload Infracost artifact for cost-gate
        if: env.INFRACOST_API_KEY != '' && steps.infracost.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: infracost-${{ env.TF_ENV }}
          path: /tmp/infracost-${{ env.TF_ENV }}.json
          retention-days: 1
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Cost estimate skipped (no API key)
        if: env.INFRACOST_API_KEY == ''
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          echo "## Cost Estimation" >> "$GITHUB_STEP_SUMMARY"
          echo "Infracost skipped — set INFRACOST_API_KEY secret (free at infracost.io) to enable cost estimates." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Infracost skipped. Add INFRACOST_API_KEY secret to enable cost estimation."

      # ── Post plan summary as PR comment ──────────────────────────────────────
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync('terraform/environments/${{ env.TF_ENV }}/plan-output.txt', 'utf8').slice(-60000);
            const body = `## 🔷 Terraform Plan — \`${{ env.TF_ENV }}\`

            **Cost delta:** \$${process.env.MONTHLY_DELTA || '0'}/mo
            **Exit code:** ${{ steps.plan.outputs.exit-code }} (0=no-change, 2=changes)

            <details><summary>Show Plan</summary>

            \`\`\`hcl
            ${planOutput}
            \`\`\`
            </details>

            > Plan artifact saved to S3: \`plans/${{ env.TF_ENV }}/${{ github.sha }}.tfplan\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });
        env:
          MONTHLY_DELTA: ${{ steps.infracost.outputs.monthly-delta }}

  # ── Cost Gate – aggregate costs across all envs, post to commit, block apply ──
  cost-gate:
    name: "Cost Gate — review before approving apply"
    runs-on: ubuntu-latest
    needs: [changed-envs, plan]
    permissions:
      contents: write     # post commit comments
      deployments: write  # stamp pending deployment status with cost info
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    steps:
      - name: Download all Infracost artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: infracost-*
          path: /tmp/infracost-results
          merge-multiple: false
        continue-on-error: true

      - name: Build cost summary, resource breakdown, and update deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            const resultsDir = '/tmp/infracost-results';
            const envDirs = fs.existsSync(resultsDir)
              ? fs.readdirSync(resultsDir, { withFileTypes: true }).filter(d => d.isDirectory())
              : [];

            if (envDirs.length === 0) {
              await core.summary.addRaw('## 💰 Cost Gate\nNo Infracost data (API key not set or no plan changes).\n').write();
              return;
            }

            // ── Parse each environment's Infracost JSON ───────────────────────
            const envData = [];
            for (const d of envDirs) {
              const envName = d.name.replace(/^infracost-/, '');
              const dir = path.join(resultsDir, d.name);
              const jsonFile = fs.readdirSync(dir).find(f => f.endsWith('.json'));
              if (!jsonFile) continue;
              const data = JSON.parse(fs.readFileSync(path.join(dir, jsonFile), 'utf8'));
              const totalCost  = parseFloat(data.totalMonthlyCost       || 0);
              const deltaCost  = parseFloat(data.diffTotalMonthlyCost   || 0);
              // diff.resources = only resources added/changed in THIS run
              const diffResources = (data.projects || []).flatMap(p => p.diff?.resources || []);
              envData.push({ envName, totalCost, deltaCost, diffResources });
            }
            envData.sort((a, b) => a.envName.localeCompare(b.envName));

            const grandTotal = envData.reduce((s, e) => s + e.totalCost,  0);
            const grandDelta = envData.reduce((s, e) => s + e.deltaCost, 0);
            const gSign = grandDelta >= 0 ? '+' : '';

            // ── Job Summary ───────────────────────────────────────────────────
            core.summary.addHeading('💰 Cost Gate — Review Before Approving Apply', 2);

            // Environment-level summary table
            core.summary.addTable([
              [{ data: 'Environment',        header: true },
               { data: 'Total Monthly Cost', header: true },
               { data: 'Delta (this run)',   header: true },
               { data: 'New/Changed Resources', header: true }],
              ...envData.map(({ envName, totalCost, deltaCost, diffResources }) => {
                const s = deltaCost >= 0 ? '+' : '';
                return [envName, `$${totalCost.toFixed(2)}`, `${s}$${deltaCost.toFixed(2)}`, String(diffResources.length)];
              }),
              ['**TOTAL**', `**$${grandTotal.toFixed(2)}**`, `**${gSign}$${grandDelta.toFixed(2)}**`, '']
            ]);

            // Per-environment resource breakdown (resources created in this run)
            for (const { envName, deltaCost, diffResources } of envData) {
              const s = deltaCost >= 0 ? '+' : '';
              core.summary.addHeading(`${envName}  —  ${s}$${deltaCost.toFixed(2)}/mo`, 3);
              if (diffResources.length === 0) {
                core.summary.addRaw('_No resource changes in this run._\n\n');
                continue;
              }
              const resourceRows = diffResources
                .map(r => ({
                  name:  r.name,
                  type:  r.resourceType || '',
                  cost:  parseFloat(r.monthlyCost || 0),
                  components: (r.costComponents || [])
                    .map(c => `${c.name}: ${c.monthlyQuantity || 0} × $${c.price || 0} = $${parseFloat(c.monthlyCost || 0).toFixed(2)}/mo`)
                    .join(', ')
                }))
                .sort((a, b) => b.cost - a.cost);

              core.summary.addTable([
                [{ data: 'Resource',        header: true },
                 { data: 'Type',            header: true },
                 { data: 'Monthly Cost',    header: true },
                 { data: 'Cost Components', header: true }],
                ...resourceRows.map(r => [r.name, r.type, `$${r.cost.toFixed(2)}`, r.components || '—'])
              ]);
            }

            core.summary.addRaw('\n> ⚠️ Approve each `terraform-*` environment below only if the cost delta is acceptable.\n');
            await core.summary.write();

            // ── Commit comment with resource-level breakdown ──────────────────
            const summaryLines = [
              '## 💰 Terraform Cost Estimate',
              '',
              '| Environment | Total Monthly | Delta (this run) | New Resources |',
              '|-------------|--------------|-----------------|---------------|',
              ...envData.map(({ envName, totalCost, deltaCost, diffResources }) => {
                const s = deltaCost >= 0 ? '+' : '';
                return `| ${envName} | $${totalCost.toFixed(2)} | ${s}$${deltaCost.toFixed(2)} | ${diffResources.length} |`;
              }),
              `| **TOTAL** | **$${grandTotal.toFixed(2)}** | **${gSign}$${grandDelta.toFixed(2)}** | |`,
            ];

            const detailSections = envData.map(({ envName, deltaCost, diffResources }) => {
              if (diffResources.length === 0) return `**${envName}**: no resource changes`;
              const s = deltaCost >= 0 ? '+' : '';
              const rows = diffResources
                .map(r => ({ name: r.name, type: r.resourceType || '', cost: parseFloat(r.monthlyCost || 0) }))
                .sort((a, b) => b.cost - a.cost)
                .map(r => `| \`${r.name}\` | ${r.type} | $${r.cost.toFixed(2)} |`)
                .join('\n');
              return [
                `<details><summary><b>${envName}</b> — ${s}$${deltaCost.toFixed(2)}/mo (${diffResources.length} resources)</summary>`,
                '',
                '| Resource | Type | Monthly Cost |',
                '|----------|------|-------------|',
                rows,
                '',
                '</details>'
              ].join('\n');
            });

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              ...summaryLines, '',
              '### Resource Breakdown (new/changed resources in this run)', '',
              ...detailSections, '',
              `> 👉 [View Cost Gate summary](${runUrl}) · Approve \`terraform-*\` environments to proceed`
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              commit_sha: context.sha,
              body
            });

            // ── Update pending deployment status for each env ─────────────────
            // GitHub creates deployments for apply jobs after cost-gate completes.
            // Retry up to 5 × 5s to find them, then stamp them with cost info.
            for (const { envName, totalCost, deltaCost, diffResources } of envData) {
              const s = deltaCost >= 0 ? '+' : '';
              const desc = `💰 $${totalCost.toFixed(2)}/mo | delta ${s}$${deltaCost.toFixed(2)} | ${diffResources.length} resources`;
              let found = false;
              for (let i = 0; i < 5; i++) {
                const { data: deploys } = await github.rest.repos.listDeployments({
                  owner: context.repo.owner, repo: context.repo.repo,
                  environment: `terraform-${envName}`, ref: context.sha, per_page: 5
                });
                if (deploys.length > 0) {
                  await github.rest.repos.createDeploymentStatus({
                    owner: context.repo.owner, repo: context.repo.repo,
                    deployment_id: deploys[0].id,
                    state: 'pending',
                    description: desc.slice(0, 140),
                    log_url: runUrl
                  });
                  found = true; break;
                }
                await new Promise(r => setTimeout(r, 5000));
              }
              if (!found) core.info(`No deployment found for terraform-${envName} — status not updated`);
            }

  # ── Terraform Apply (main branch only, post-PR-approval) ─────────────────────
  apply:
    name: Apply [${{ matrix.environment }}]
    runs-on: ubuntu-latest
    needs: [changed-envs, plan, cost-gate]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    strategy:
      max-parallel: 1   # no concurrent applies across envs
      matrix: ${{ fromJSON(needs.changed-envs.outputs.matrix) }}
    environment:
      name: terraform-${{ matrix.environment }}   # requires reviewer approval in GitHub Environments
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      TF_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform init -reconfigure

      - name: Download approved plan from S3
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: |
          aws s3 cp \
            s3://${{ secrets.TF_STATE_BUCKET }}/plans/${{ env.TF_ENV }}/${{ github.sha }}.tfplan \
            tfplan

      - name: Terraform apply (approved plan only)
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform apply -input=false tfplan

      - name: Notify Teams on success
        if: success()
        continue-on-error: true
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK }}
          title: "✅ Terraform applied: ${{ env.TF_ENV }}"
          summary: "SHA: ${{ github.sha }} | Apply complete"
          theme_color: "0078D4"

      - name: Notify Teams on failure
        if: failure()
        continue-on-error: true
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK }}
          title: "❌ Terraform FAILED: ${{ env.TF_ENV }}"
          summary: "SHA: ${{ github.sha }} | Check Actions for details"
          theme_color: "FF0000"
