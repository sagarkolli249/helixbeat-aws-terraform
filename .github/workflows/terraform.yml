###############################################################################
# HelixBeat – Terraform IaC Pipeline
#
# Flow: PR → Plan + Security + Resource Cost → Push to main → Cost Gate
#       → Manual Approval (sees cost per resource) → Apply → Notify
#
# Triggers:
#   - PR touching terraform/** → plan + cost + security scan (no apply)
#   - Push to main touching terraform/** → full pipeline with approval
#   - Manual workflow_dispatch → target a specific environment
###############################################################################
name: Terraform IaC Pipeline

on:
  pull_request:
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  push:
    branches: [main]
    paths:
      - "terraform/**"
      - ".github/workflows/terraform.yml"
  workflow_dispatch:
    inputs:
      environment:
        description: "Target environment"
        required: true
        type: choice
        options: [dev-us, dev-in, staging-us, staging-in]
      action:
        description: "Terraform action"
        required: true
        type: choice
        options: [plan, apply, destroy]

permissions:
  id-token: write
  contents: read
  pull-requests: write
  issues: write
  security-events: write

env:
  TF_VERSION: "1.7.5"
  COST_THRESHOLD_USD: 500

jobs:
  # ── Detect which environments changed ────────────────────────────────────────
  changed-envs:
    name: Detect changed environments
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Determine changed environments
        id: set
        run: |
          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            ENVS='["${{ inputs.environment }}"]'
          else
            CHANGED=$(git diff --name-only ${{ github.event.before || 'HEAD~1' }} HEAD \
              | grep '^terraform/environments/' \
              | awk -F'/' '{print $3}' | sort -u \
              | jq -R . | jq -sc .)
            MODULE_CHANGED=$(git diff --name-only ${{ github.event.before || 'HEAD~1' }} HEAD \
              | grep -qE '^terraform/(env-base|modules)/' && echo "true" || echo "false")
            if [[ "$MODULE_CHANGED" == "true" ]]; then
              ENVS='["dev-us","dev-in","staging-us","staging-in"]'
            elif [[ -z "$CHANGED" || "$CHANGED" == "[]" ]]; then
              ENVS='["dev-us"]'
            else
              ENVS="$CHANGED"
            fi
          fi
          echo "matrix={\"environment\":${ENVS}}" >> "$GITHUB_OUTPUT"
          echo "Environments to target: $ENVS"

  # ── Terraform Plan + Security + Per-resource Cost ────────────────────────────
  plan:
    name: Plan [${{ matrix.environment }}]
    runs-on: ubuntu-latest
    needs: changed-envs
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changed-envs.outputs.matrix) }}
    env:
      TF_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform ${{ env.TF_VERSION }}
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform fmt check
        run: terraform fmt -recursive -check terraform/

      - name: Terraform init
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform init -reconfigure

      - name: Terraform validate
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform validate

      - name: Terraform plan
        id: plan
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: |
          terraform plan \
            -out=tfplan \
            -detailed-exitcode \
            -input=false \
            2>&1 | tee plan-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          echo "exit-code=${EXIT_CODE}" >> "$GITHUB_OUTPUT"
          if [[ $EXIT_CODE -eq 1 ]]; then exit 1; fi

      # Export plan to JSON so Infracost can read exactly which resources are being created
      - name: Export plan as JSON
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform show -json tfplan > tfplan.json

      - name: Upload plan artifacts to S3
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: |
          aws s3 cp tfplan \
            s3://${{ secrets.TF_STATE_BUCKET }}/plans/${{ env.TF_ENV }}/${{ github.sha }}.tfplan \
            --sse aws:kms
          aws s3 cp plan-output.txt \
            s3://${{ secrets.TF_STATE_BUCKET }}/plans/${{ env.TF_ENV }}/${{ github.sha }}-output.txt
          aws s3 cp tfplan.json \
            s3://${{ secrets.TF_STATE_BUCKET }}/plans/${{ env.TF_ENV }}/${{ github.sha }}-plan.json

      # ── tfsec security scan ──────────────────────────────────────────────────
      - name: tfsec (AWS security rules)
        uses: aquasecurity/tfsec-action@v1.0.3
        with:
          working_directory: terraform/
          format: sarif
          soft_fail: true

      # ── Checkov CIS benchmark ────────────────────────────────────────────────
      - name: Checkov (CIS AWS benchmark)
        uses: bridgecrewio/checkov-action@v12
        with:
          directory: terraform/
          framework: terraform
          output_format: sarif
          output_file_path: checkov.sarif
          soft_fail: true
          skip_check: CKV_AWS_123,CKV2_AWS_5,CKV_AWS_382,CKV_AWS_260,CKV_AWS_150,CKV_AWS_23,CKV_AWS_300,CKV_AWS_144,CKV_AWS_18,CKV_AWS_290,CKV2_AWS_18,CKV_AWS_21,CKV_AWS_145,CKV2_AWS_6,CKV2_AWS_62,CKV_AWS_355,CKV2_AWS_3,CKV2_AWS_31,CKV2_AWS_23,CKV2_AWS_57,CKV2_AWS_38,CKV2_AWS_39,CKV2_AWS_61,CKV2_AWS_76,CKV_AWS_13,CKV_AWS_158,CKV_AWS_252,CKV_AWS_338

      - name: Upload Checkov SARIF
        if: always() && hashFiles('checkov.sarif') != ''
        continue-on-error: true   # GHAS not required — private repos without Advanced Security skip gracefully
        uses: github/codeql-action/upload-sarif@v3
        with:
          sarif_file: checkov.sarif

      # ── Infracost — plan-based: prices only resources being created/changed ───
      - name: Setup Infracost
        if: env.INFRACOST_API_KEY != ''
        uses: infracost/actions/setup@v3
        with:
          api-key: ${{ secrets.INFRACOST_API_KEY }}
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Infracost — cost for resources in this plan
        id: infracost
        if: env.INFRACOST_API_KEY != ''
        working-directory: terraform/environments/${{ env.TF_ENV }}
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          # Use the plan JSON so we price ONLY resources being created/changed
          infracost breakdown \
            --path tfplan.json \
            --format json \
            --out-file /tmp/infracost-${{ env.TF_ENV }}.json

          MONTHLY_COST=$(jq -r '.totalMonthlyCost // "0"' /tmp/infracost-${{ env.TF_ENV }}.json)
          echo "monthly-cost=${MONTHLY_COST}" >> "$GITHUB_OUTPUT"

          # ── Per-resource table in the job step summary ────────────────────
          echo "## 💰 Cost Estimate — \`${{ env.TF_ENV }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "**Total monthly cost (resources in this plan): \$${MONTHLY_COST}**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource | Type | Monthly Cost | Details |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|------|-------------|---------|" >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            .projects[].breakdown.resources[]
            | . as $r
            | [
                $r.name,
                ($r.resourceType // ""),
                ("$" + (($r.monthlyCost // "0") | tonumber | . * 100 | round / 100 | tostring)),
                ([$r.costComponents[]? | .name + ": $" + ((.monthlyCost // "0") | tonumber | . * 100 | round / 100 | tostring) + "/mo"] | join(", "))
              ]
            | "| `\(.[0])` | \(.[1]) | \(.[2]) | \(.[3]) |"
          ' /tmp/infracost-${{ env.TF_ENV }}.json \
            2>/dev/null | sort >> "$GITHUB_STEP_SUMMARY" || echo "| — | no resources with known pricing | — | — |" >> "$GITHUB_STEP_SUMMARY"

          echo "" >> "$GITHUB_STEP_SUMMARY"

          # Warn if above threshold (does not block — cost-gate has the approval)
          if (( $(echo "${MONTHLY_COST:-0} > ${{ env.COST_THRESHOLD_USD }}" | bc -l 2>/dev/null || echo 0) )); then
            echo "::warning::Monthly cost \$${MONTHLY_COST} exceeds threshold \$${{ env.COST_THRESHOLD_USD }}"
            echo "> ⚠️ Cost \$${MONTHLY_COST}/mo exceeds alert threshold \$${{ env.COST_THRESHOLD_USD }}/mo" >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload Infracost JSON for cost-gate
        if: env.INFRACOST_API_KEY != '' && steps.infracost.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: infracost-${{ env.TF_ENV }}
          path: /tmp/infracost-${{ env.TF_ENV }}.json
          retention-days: 1
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}

      - name: Cost estimation skipped (no API key)
        if: env.INFRACOST_API_KEY == ''
        env:
          INFRACOST_API_KEY: ${{ secrets.INFRACOST_API_KEY }}
        run: |
          echo "## 💰 Cost Estimate" >> "$GITHUB_STEP_SUMMARY"
          echo "Skipped — add INFRACOST_API_KEY secret (free at infracost.io) to enable resource-level cost estimates." >> "$GITHUB_STEP_SUMMARY"
          echo "::notice::Infracost skipped. Add INFRACOST_API_KEY secret to enable cost estimation."

      # ── Post plan + cost summary as PR comment ────────────────────────────────
      - name: Comment plan on PR
        if: github.event_name == 'pull_request'
        uses: actions/github-script@v7
        env:
          MONTHLY_COST: ${{ steps.infracost.outputs.monthly-cost }}
          TF_ENV: ${{ env.TF_ENV }}
        with:
          script: |
            const fs = require('fs');
            const planOutput = fs.readFileSync(
              `terraform/environments/${process.env.TF_ENV}/plan-output.txt`, 'utf8'
            ).slice(-60000);

            // Build resource cost table from Infracost JSON if present
            let resourceTable = '_Cost estimate unavailable (INFRACOST_API_KEY not set)._';
            try {
              const ic = JSON.parse(fs.readFileSync(
                `/tmp/infracost-${process.env.TF_ENV}.json`, 'utf8'
              ));
              const resources = (ic.projects || []).flatMap(p => p.breakdown?.resources || []);
              if (resources.length > 0) {
                const rows = resources
                  .map(r => ({
                    name: r.name,
                    type: r.resourceType || '',
                    cost: parseFloat(r.monthlyCost || 0),
                    detail: (r.costComponents || [])
                      .map(c => `${c.name}: $${parseFloat(c.monthlyCost || 0).toFixed(2)}/mo`)
                      .join(', ')
                  }))
                  .sort((a, b) => b.cost - a.cost);

                resourceTable = [
                  '| Resource | Type | Monthly Cost | Details |',
                  '|----------|------|-------------|---------|',
                  ...rows.map(r => `| \`${r.name}\` | ${r.type} | $${r.cost.toFixed(2)} | ${r.detail || '—'} |`)
                ].join('\n');
              } else {
                resourceTable = '_No resources with known pricing in this plan._';
              }
            } catch (_) {}

            const monthlyCost = process.env.MONTHLY_COST || '0';
            const body = `## Terraform Plan — \`${process.env.TF_ENV}\`

            **Estimated monthly cost (resources in this plan): $${monthlyCost}**

            ### Resources & Costs
            ${resourceTable}

            <details><summary>Show full plan output</summary>

            \`\`\`
            ${planOutput}
            \`\`\`
            </details>

            > Plan artifact: \`plans/${process.env.TF_ENV}/${{ github.sha }}.tfplan\``;

            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
              body
            });

  # ── Cost Gate — aggregate, post commit comment, update deployment status ──────
  cost-gate:
    name: "Cost Gate — review before approving apply"
    runs-on: ubuntu-latest
    needs: [changed-envs, plan]
    permissions:
      contents: write
      deployments: write
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    steps:
      - name: Download all Infracost artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: infracost-*
          path: /tmp/infracost-results
          merge-multiple: false
        continue-on-error: true

      - name: Build cost summary and update deployment status
        uses: actions/github-script@v7
        with:
          script: |
            const fs   = require('fs');
            const path = require('path');

            const resultsDir = '/tmp/infracost-results';
            const envDirs = fs.existsSync(resultsDir)
              ? fs.readdirSync(resultsDir, { withFileTypes: true }).filter(d => d.isDirectory())
              : [];

            if (envDirs.length === 0) {
              await core.summary
                .addHeading('Cost Gate', 2)
                .addRaw('No Infracost data — add INFRACOST_API_KEY secret to enable resource-level cost estimates.\n')
                .write();
              return;
            }

            // ── Parse each environment's Infracost JSON ───────────────────────
            const envData = [];
            for (const d of envDirs) {
              const envName = d.name.replace(/^infracost-/, '');
              const dir = path.join(resultsDir, d.name);
              const jsonFile = fs.readdirSync(dir).find(f => f.endsWith('.json'));
              if (!jsonFile) continue;
              const data = JSON.parse(fs.readFileSync(path.join(dir, jsonFile), 'utf8'));
              const totalCost = parseFloat(data.totalMonthlyCost || 0);
              // breakdown.resources = resources priced in the plan (plan-based breakdown)
              const resources = (data.projects || []).flatMap(p => p.breakdown?.resources || []);
              envData.push({ envName, totalCost, resources });
            }
            envData.sort((a, b) => a.envName.localeCompare(b.envName));

            const grandTotal = envData.reduce((s, e) => s + e.totalCost, 0);

            // ── Job Summary ───────────────────────────────────────────────────
            core.summary.addHeading('💰 Cost Gate — Review Before Approving Apply', 2);
            core.summary.addRaw('> Resources priced below are exactly the ones being **created or changed** in this pipeline run.\n\n');

            core.summary.addTable([
              [{ data: 'Environment', header: true },
               { data: 'Monthly Cost (this plan)', header: true },
               { data: 'Resources in Plan', header: true }],
              ...envData.map(({ envName, totalCost, resources }) => [
                envName, `$${totalCost.toFixed(2)}`, String(resources.length)
              ]),
              ['**TOTAL**', `**$${grandTotal.toFixed(2)}**`, '']
            ]);

            // Per-environment resource breakdown
            for (const { envName, totalCost, resources } of envData) {
              core.summary.addHeading(`${envName}  —  $${totalCost.toFixed(2)}/mo`, 3);
              if (resources.length === 0) {
                core.summary.addRaw('_No resources with known pricing in this plan._\n\n');
                continue;
              }
              const rows = resources
                .map(r => ({
                  name: r.name,
                  type: r.resourceType || '',
                  cost: parseFloat(r.monthlyCost || 0),
                  components: (r.costComponents || [])
                    .map(c => `${c.name}: $${parseFloat(c.monthlyCost || 0).toFixed(2)}/mo`)
                    .join(' · ')
                }))
                .sort((a, b) => b.cost - a.cost);

              core.summary.addTable([
                [{ data: 'Resource',        header: true },
                 { data: 'Type',            header: true },
                 { data: 'Monthly Cost',    header: true },
                 { data: 'Cost Components', header: true }],
                ...rows.map(r => [r.name, r.type, `$${r.cost.toFixed(2)}`, r.components || '—'])
              ]);
            }

            core.summary.addRaw('\n> Approve each `terraform-*` environment below only if the cost is acceptable.\n');
            await core.summary.write();

            // ── Commit comment ────────────────────────────────────────────────
            const tableHeader = [
              '## 💰 Terraform Cost Estimate (Resources Being Created)',
              '',
              '> The table below shows **only resources in this plan** — not pre-existing infrastructure.',
              '',
              '| Environment | Monthly Cost | Resources in Plan |',
              '|-------------|-------------|-------------------|',
              ...envData.map(({ envName, totalCost, resources }) =>
                `| ${envName} | $${totalCost.toFixed(2)} | ${resources.length} |`
              ),
              `| **TOTAL** | **$${grandTotal.toFixed(2)}** | |`,
              ''
            ];

            const detailSections = envData.map(({ envName, totalCost, resources }) => {
              if (resources.length === 0)
                return `**${envName}**: no resources with known pricing`;
              const rows = resources
                .map(r => ({
                  name: r.name,
                  type: r.resourceType || '',
                  cost: parseFloat(r.monthlyCost || 0)
                }))
                .sort((a, b) => b.cost - a.cost)
                .map(r => `| \`${r.name}\` | ${r.type} | $${r.cost.toFixed(2)}/mo |`)
                .join('\n');
              return [
                `<details><summary><b>${envName}</b> — $${totalCost.toFixed(2)}/mo (${resources.length} resources)</summary>`,
                '',
                '| Resource | Type | Monthly Cost |',
                '|----------|------|-------------|',
                rows,
                '',
                '</details>'
              ].join('\n');
            });

            const runUrl = `${process.env.GITHUB_SERVER_URL}/${process.env.GITHUB_REPOSITORY}/actions/runs/${process.env.GITHUB_RUN_ID}`;
            const body = [
              ...tableHeader,
              '### Per-Resource Breakdown',
              '',
              ...detailSections,
              '',
              `> [View full Cost Gate summary](${runUrl}) · Approve \`terraform-*\` environments to proceed with apply`
            ].join('\n');

            await github.rest.repos.createCommitComment({
              owner: context.repo.owner,
              repo:  context.repo.repo,
              commit_sha: context.sha,
              body
            });

            // ── Stamp pending deployment statuses with cost info ──────────────
            for (const { envName, totalCost, resources } of envData) {
              const desc = `$${totalCost.toFixed(2)}/mo · ${resources.length} resources being created`;
              let found = false;
              for (let i = 0; i < 5; i++) {
                const { data: deploys } = await github.rest.repos.listDeployments({
                  owner: context.repo.owner, repo: context.repo.repo,
                  environment: `terraform-${envName}`, ref: context.sha, per_page: 5
                });
                if (deploys.length > 0) {
                  await github.rest.repos.createDeploymentStatus({
                    owner: context.repo.owner, repo: context.repo.repo,
                    deployment_id: deploys[0].id,
                    state: 'pending',
                    description: desc.slice(0, 140),
                    log_url: runUrl
                  });
                  found = true; break;
                }
                await new Promise(r => setTimeout(r, 5000));
              }
              if (!found) core.info(`No deployment found for terraform-${envName}`);
            }

  # ── Terraform Apply ───────────────────────────────────────────────────────────
  apply:
    name: Apply [${{ matrix.environment }}]
    runs-on: ubuntu-latest
    needs: [changed-envs, plan, cost-gate]
    if: >
      (github.event_name == 'push' && github.ref == 'refs/heads/main') ||
      (github.event_name == 'workflow_dispatch' && inputs.action == 'apply')
    strategy:
      max-parallel: 1
      matrix: ${{ fromJSON(needs.changed-envs.outputs.matrix) }}
    environment:
      name: terraform-${{ matrix.environment }}
      url: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    env:
      TF_ENV: ${{ matrix.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform init -reconfigure

      - name: Download approved plan from S3
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: |
          aws s3 cp \
            s3://${{ secrets.TF_STATE_BUCKET }}/plans/${{ env.TF_ENV }}/${{ github.sha }}.tfplan \
            tfplan

      - name: Terraform apply
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform apply -input=false tfplan

      # ── Post-apply cost summary ──────────────────────────────────────────────
      - name: Download Infracost artifact for post-apply summary
        uses: actions/download-artifact@v4
        with:
          name: infracost-${{ env.TF_ENV }}
          path: /tmp
        continue-on-error: true

      - name: Post-apply resource cost summary
        run: |
          IC_FILE="/tmp/infracost-${{ env.TF_ENV }}.json"
          echo "## Resources Created — Cost Summary" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"

          if [[ ! -f "$IC_FILE" ]]; then
            echo "_Infracost data not available. Add INFRACOST_API_KEY secret to see per-resource costs._" >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi

          TOTAL=$(jq -r '.totalMonthlyCost // "0"' "$IC_FILE")
          RESOURCE_COUNT=$(jq '[.projects[].breakdown.resources[]] | length' "$IC_FILE")
          echo "**Environment:** \`${{ env.TF_ENV }}\`  |  **Resources:** ${RESOURCE_COUNT}  |  **Total: \$${TOTAL}/mo**" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "| Resource | Type | Monthly Cost | Cost Components |" >> "$GITHUB_STEP_SUMMARY"
          echo "|----------|------|-------------|----------------|" >> "$GITHUB_STEP_SUMMARY"

          jq -r '
            .projects[].breakdown.resources[]
            | . as $r
            | [
                ("`" + $r.name + "`"),
                ($r.resourceType // ""),
                ("$" + (($r.monthlyCost // "0") | tonumber | . * 100 | round / 100 | tostring) + "/mo"),
                ([$r.costComponents[]? | .name + ": $" + ((.monthlyCost // "0") | tonumber | . * 100 | round / 100 | tostring)] | join(" · "))
              ]
            | "| \(.[0]) | \(.[1]) | \(.[2]) | \(.[3]) |"
          ' "$IC_FILE" 2>/dev/null | sort -t'$' -k2 -rn >> "$GITHUB_STEP_SUMMARY" \
            || echo "| — | No resources with known pricing | — | — |" >> "$GITHUB_STEP_SUMMARY"

      - name: Notify Teams on success
        if: success()
        continue-on-error: true
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK }}
          title: "Terraform applied: ${{ env.TF_ENV }}"
          summary: "SHA: ${{ github.sha }} | Apply complete"
          theme_color: "0078D4"

      - name: Notify Teams on failure
        if: failure()
        continue-on-error: true
        uses: aliencube/microsoft-teams-actions@v0.8.0
        with:
          webhook_uri: ${{ secrets.TEAMS_WEBHOOK }}
          title: "Terraform FAILED: ${{ env.TF_ENV }}"
          summary: "SHA: ${{ github.sha }} | Check Actions for details"
          theme_color: "FF0000"

  # ── Terraform Destroy (manual workflow_dispatch only) ─────────────────────────
  destroy:
    name: "DESTROY [${{ inputs.environment }}]"
    runs-on: ubuntu-latest
    needs: changed-envs
    if: github.event_name == 'workflow_dispatch' && inputs.action == 'destroy'
    environment: terraform-${{ inputs.environment }}
    env:
      TF_ENV: ${{ inputs.environment }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false

      - name: Configure AWS credentials (OIDC)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_TF_ROLE_ARN }}
          aws-region: ${{ secrets.AWS_REGION }}

      - name: Terraform init
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform init -reconfigure

      - name: Terraform destroy
        working-directory: terraform/environments/${{ env.TF_ENV }}
        run: terraform destroy -auto-approve -input=false

      - name: Clear stale state lock
        if: always()
        run: |
          aws dynamodb delete-item \
            --table-name helixbeat-tfstate-lock-${{ env.TF_ENV }} \
            --key '{"LockID": {"S": "helixbeat-tfstate-${{ env.TF_ENV }}/${{ env.TF_ENV }}/terraform.tfstate"}}' \
            --region ${{ secrets.AWS_REGION }} 2>/dev/null || true
