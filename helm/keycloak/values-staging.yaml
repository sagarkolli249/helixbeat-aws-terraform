###############################################################################
# Keycloak – Staging overrides (India primary, HA replicas)
###############################################################################
keycloak:
  replicaCount: 2

  ingress:
    hostname: auth.staging-in.helixbeat.com

  resources:
    requests:
      cpu: 500m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 2Gi

  nodeSelector:
    region: india
    role: app

  affinity:
    podAntiAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        - labelSelector:
            matchLabels:
              app.kubernetes.io/name: keycloak
          topologyKey: kubernetes.io/hostname
