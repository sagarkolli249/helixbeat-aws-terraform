###############################################################################
# Observability – Staging overrides (production-like, longer retention)
###############################################################################
prometheus:
  prometheus:
    prometheusSpec:
      retention: 30d
      retentionSize: "20GB"
      replicas: 2
      storageSpec:
        volumeClaimTemplate:
          spec:
            resources:
              requests:
                storage: 40Gi
      resources:
        requests:
          cpu: 500m
          memory: 2Gi
        limits:
          cpu: "4"
          memory: 4Gi

  grafana:
    replicas: 2
    ingress:
      hosts:
        - grafana.staging-in.helixbeat.com

  alertmanager:
    enabled: true

loki:
  deploymentMode: SimpleScalable
  loki:
    storage:
      s3:
        region: ap-south-1
    commonConfig:
      replication_factor: 2
    limits_config:
      retention_period: 720h   # 30 days

  read:
    replicas: 2
    nodeSelector:
      region: india
      role: app

  write:
    replicas: 2
    nodeSelector:
      region: india
      role: app

  backend:
    replicas: 2
    nodeSelector:
      region: india
      role: app
