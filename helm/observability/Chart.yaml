apiVersion: v2
name: helixbeat-observability
description: Prometheus + Grafana + Loki observability stack for HelixBeat
type: application
version: 1.0.0

dependencies:
  - name: kube-prometheus-stack
    version: "58.2.2"
    repository: "https://prometheus-community.github.io/helm-charts"
    alias: prometheus

  - name: loki
    version: "6.6.2"
    repository: "https://grafana.github.io/helm-charts"

  - name: promtail
    version: "6.15.5"
    repository: "https://grafana.github.io/helm-charts"
