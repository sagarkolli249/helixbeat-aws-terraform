###############################################################################
# Loki (Simple Scalable) Helm values
# Chart: https://github.com/grafana/helm-charts/tree/main/charts/loki
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install loki grafana/loki \
#     --namespace monitoring \
#     -f values.yaml
###############################################################################

fullnameOverride: loki

## ── Deployment mode ─────────────────────────────────────────────────────────
# SimpleScalable splits Loki into read/write/backend components for resilience
deploymentMode: SimpleScalable

loki:
  auth_enabled: false

  commonConfig:
    replication_factor: 2

  storage:
    type: s3
    s3:
      # Replace with actual bucket name and region after terraform apply
      bucketnames: helixbeat-ENV-monitoring-ACCOUNT_ID
      region: us-east-1
      # IRSA is used – no static credentials needed
      insecure: false
      sse_encryption: true

  schemaConfig:
    configs:
      - from: "2024-01-01"
        store: tsdb
        object_store: s3
        schema: v13
        index:
          prefix: loki_index_
          period: 24h

  limits_config:
    retention_period: 744h   # 31 days
    ingestion_rate_mb: 16
    ingestion_burst_size_mb: 24
    max_query_series: 10000
    max_entries_limit_per_query: 50000
    reject_old_samples: true
    reject_old_samples_max_age: 168h   # 7 days

  compactor:
    retention_enabled: true
    delete_request_store: s3

## ── Write component ─────────────────────────────────────────────────────────
write:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  persistence:
    enableStatefulSetAutoDeletePVC: true
    size: 10Gi
    storageClass: gp3

## ── Read component ──────────────────────────────────────────────────────────
read:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  persistence:
    enableStatefulSetAutoDeletePVC: true
    size: 10Gi
    storageClass: gp3

## ── Backend component ────────────────────────────────────────────────────────
backend:
  replicas: 2
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 10001
    fsGroup: 10001
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true
  persistence:
    size: 10Gi
    storageClass: gp3

## ── Service Account (IRSA) ───────────────────────────────────────────────────
serviceAccount:
  create: true
  name: loki
  annotations:
    # Replace with actual role ARN after terraform apply
    eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/helixbeat-ENV-monitoring"

## ── Promtail (log shipper) ───────────────────────────────────────────────────
# Deploy promtail as DaemonSet to collect logs from all nodes
# Install separately:
#   helm upgrade --install promtail grafana/promtail \
#     --namespace monitoring -f promtail-values.yaml

## ── Monitoring ───────────────────────────────────────────────────────────────
monitoring:
  serviceMonitor:
    enabled: true
    namespace: monitoring
    labels:
      release: kube-prometheus-stack
  selfMonitoring:
    enabled: false   # Requires Grafana Agent
  lokiCanary:
    enabled: true    # End-to-end write/read health check

## ── Gateway ─────────────────────────────────────────────────────────────────
gateway:
  enabled: true
  replicas: 2
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 200m
      memory: 128Mi
  service:
    type: ClusterIP
    port: 80
