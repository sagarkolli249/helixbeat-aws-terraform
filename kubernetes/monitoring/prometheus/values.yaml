###############################################################################
# kube-prometheus-stack Helm values
# Chart: https://github.com/prometheus-community/helm-charts/tree/main/charts/kube-prometheus-stack
# Install:
#   helm repo add prometheus-community https://prometheus-community.github.io/helm-charts
#   helm upgrade --install kube-prometheus-stack prometheus-community/kube-prometheus-stack \
#     --namespace monitoring --create-namespace \
#     -f values.yaml
###############################################################################

## ── Global ──────────────────────────────────────────────────────────────────
fullnameOverride: prometheus

## ── Prometheus Operator ─────────────────────────────────────────────────────
prometheusOperator:
  enabled: true
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 200m
      memory: 256Mi
  securityContext:
    runAsNonRoot: true
    runAsUser: 65534
    fsGroup: 65534
    seccompProfile:
      type: RuntimeDefault
  containerSecurityContext:
    allowPrivilegeEscalation: false
    capabilities:
      drop: [ALL]
    readOnlyRootFilesystem: true

## ── Prometheus ───────────────────────────────────────────────────────────────
prometheus:
  enabled: true

  serviceAccount:
    create: true
    name: prometheus
    annotations:
      # IRSA – replace with actual role ARN after terraform apply
      eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/helixbeat-ENV-monitoring"

  prometheusSpec:
    retention: 15d
    retentionSize: "45GB"

    replicas: 2

    resources:
      requests:
        cpu: 500m
        memory: 1Gi
      limits:
        cpu: 1000m
        memory: 2Gi

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault

    storageSpec:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 50Gi

    # Scrape all ServiceMonitors and PodMonitors across all namespaces
    serviceMonitorSelectorNilUsesHelmValues: false
    podMonitorSelectorNilUsesHelmValues: false
    ruleSelectorNilUsesHelmValues: false

    # External labels for federation/Thanos
    externalLabels:
      cluster: helixbeat-ENV
      region: us-east-1

    # AlertManager integration
    alerting:
      alertmanagers:
        - namespace: monitoring
          name: alertmanager-operated
          port: web

    # Additional scrape configs (node-exporter, cAdvisor already included via kube-prometheus-stack)
    additionalScrapeConfigs: []

  # Service Monitor for self-scraping
  serviceMonitor:
    selfMonitor: true

## ── AlertManager ────────────────────────────────────────────────────────────
alertmanager:
  enabled: true

  alertmanagerSpec:
    replicas: 2
    retention: 120h

    resources:
      requests:
        cpu: 50m
        memory: 64Mi
      limits:
        cpu: 100m
        memory: 128Mi

    securityContext:
      runAsNonRoot: true
      runAsUser: 65534
      fsGroup: 65534
      seccompProfile:
        type: RuntimeDefault

    storage:
      volumeClaimTemplate:
        spec:
          storageClassName: gp3
          accessModes: [ReadWriteOnce]
          resources:
            requests:
              storage: 5Gi

  config:
    global:
      resolve_timeout: 5m
      # Configure your SMTP or Slack webhook here
      # smtp_smarthost: 'smtp.example.com:587'
      # smtp_from: 'alertmanager@helixbeat.com'

    route:
      group_by: [alertname, cluster, service]
      group_wait: 30s
      group_interval: 5m
      repeat_interval: 12h
      receiver: default

      routes:
        - match:
            severity: critical
          receiver: critical
          continue: true
        - match:
            severity: warning
          receiver: warning

    receivers:
      - name: default
        # Add your notification config (Slack, PagerDuty, email, etc.)
      - name: critical
        # Example Slack config:
        # slack_configs:
        #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        #     channel: '#helixbeat-alerts-critical'
        #     title: '[{{ .Status | toUpper }}] {{ .CommonLabels.alertname }}'
        #     text: '{{ range .Alerts }}{{ .Annotations.description }}{{ end }}'
      - name: warning
        # slack_configs:
        #   - api_url: 'https://hooks.slack.com/services/YOUR/SLACK/WEBHOOK'
        #     channel: '#helixbeat-alerts'

    inhibit_rules:
      - source_match:
          severity: critical
        target_match:
          severity: warning
        equal: [alertname, namespace]

## ── Grafana ──────────────────────────────────────────────────────────────────
# Grafana is deployed separately via its own values.yaml
grafana:
  enabled: false

## ── Node Exporter ───────────────────────────────────────────────────────────
nodeExporter:
  enabled: true

## ── kube-state-metrics ──────────────────────────────────────────────────────
kubeStateMetrics:
  enabled: true

## ── Default Rules ────────────────────────────────────────────────────────────
defaultRules:
  create: true
  rules:
    alertmanager: true
    etcd: true
    configReloaders: true
    general: true
    k8sContainerCpuUsageSecondsTotal: true
    k8sContainerMemoryCache: true
    k8sContainerMemoryRss: true
    k8sPodOwner: true
    kubeApiserverAvailability: true
    kubeApiserverBurnrate: true
    kubeApiserverHistogram: true
    kubeApiserverSlos: true
    kubeControllerManager: true
    kubelet: true
    kubeProxy: true
    kubePrometheusGeneral: true
    kubePrometheusNodeRecording: true
    kubernetesApps: true
    kubernetesResources: true
    kubernetesStorage: true
    kubernetesSystem: true
    kubeSchedulerAlerting: true
    kubeSchedulerRecording: true
    kubeStateMetrics: true
    network: true
    node: true
    nodeExporterAlerting: true
    nodeExporterRecording: true
    prometheus: true
    prometheusOperator: true

## ── EKS-specific: disable components managed by AWS ────────────────────────
kubeControllerManager:
  enabled: false   # Not accessible in EKS

kubeScheduler:
  enabled: false   # Not accessible in EKS

kubeEtcd:
  enabled: false   # Managed by AWS
