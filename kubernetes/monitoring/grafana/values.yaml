###############################################################################
# Grafana Helm values
# Chart: https://github.com/grafana/helm-charts/tree/main/charts/grafana
# Install:
#   helm repo add grafana https://grafana.github.io/helm-charts
#   helm upgrade --install grafana grafana/grafana \
#     --namespace monitoring \
#     -f values.yaml
###############################################################################

fullnameOverride: grafana

replicas: 2

## ── Image ────────────────────────────────────────────────────────────────────
image:
  repository: grafana/grafana
  tag: "10.4.0"
  pullPolicy: IfNotPresent

## ── Security ─────────────────────────────────────────────────────────────────
securityContext:
  runAsNonRoot: true
  runAsUser: 472
  fsGroup: 472
  seccompProfile:
    type: RuntimeDefault

containerSecurityContext:
  allowPrivilegeEscalation: false
  capabilities:
    drop: [ALL]
  readOnlyRootFilesystem: true

## ── Service Account ──────────────────────────────────────────────────────────
serviceAccount:
  create: true
  name: grafana

## ── Admin credentials (use Kubernetes secret – do NOT hardcode) ──────────────
admin:
  existingSecret: grafana-admin-credentials
  userKey: admin-user
  passwordKey: admin-password

## ── Resources ────────────────────────────────────────────────────────────────
resources:
  requests:
    cpu: 100m
    memory: 256Mi
  limits:
    cpu: 500m
    memory: 512Mi

## ── Persistence ──────────────────────────────────────────────────────────────
persistence:
  enabled: true
  storageClassName: gp3
  size: 10Gi
  accessModes:
    - ReadWriteOnce

## ── Service ──────────────────────────────────────────────────────────────────
service:
  type: ClusterIP
  port: 80
  targetPort: 3000

## ── Ingress (configure after ALB Ingress Controller is running) ──────────────
ingress:
  enabled: false
  # annotations:
  #   kubernetes.io/ingress.class: alb
  #   alb.ingress.kubernetes.io/scheme: internal
  #   alb.ingress.kubernetes.io/target-type: ip
  #   alb.ingress.kubernetes.io/certificate-arn: "arn:aws:acm:..."
  # hosts:
  #   - grafana.internal.helixbeat.com
  # tls:
  #   - hosts:
  #       - grafana.internal.helixbeat.com

## ── Grafana Configuration ────────────────────────────────────────────────────
grafana.ini:
  server:
    root_url: "https://grafana.internal.helixbeat.com"
    serve_from_sub_path: false
  security:
    disable_initial_admin_creation: false
    cookie_secure: true
    cookie_samesite: strict
    strict_transport_security: true
    strict_transport_security_max_age_seconds: 86400
    x_content_type_options: true
    x_xss_protection: true
  auth:
    disable_login_form: false
    oauth_auto_login: false
  auth.anonymous:
    enabled: false
  users:
    allow_sign_up: false
    allow_org_create: false
  log:
    mode: console
    level: info
  analytics:
    reporting_enabled: false
    check_for_updates: false
  alerting:
    enabled: true

## ── Data Sources ─────────────────────────────────────────────────────────────
datasources:
  datasources.yaml:
    apiVersion: 1
    datasources:
      - name: Prometheus
        type: prometheus
        url: http://prometheus-operated:9090
        access: proxy
        isDefault: true
        jsonData:
          timeInterval: "30s"

      - name: Loki
        type: loki
        url: http://loki:3100
        access: proxy
        jsonData:
          maxLines: 1000

## ── Dashboards – sidecar auto-discovery ─────────────────────────────────────
sidecar:
  dashboards:
    enabled: true
    searchNamespace: ALL
    label: grafana_dashboard
    labelValue: "1"
    folderAnnotation: grafana_folder
    provider:
      foldersFromFilesStructure: true
  datasources:
    enabled: true
    searchNamespace: monitoring

## ── Pre-built dashboards via ConfigMaps ─────────────────────────────────────
dashboardProviders:
  dashboardproviders.yaml:
    apiVersion: 1
    providers:
      - name: default
        orgId: 1
        folder: ""
        type: file
        disableDeletion: false
        editable: true
        options:
          path: /var/lib/grafana/dashboards/default

dashboards:
  default:
    kubernetes-cluster:
      gnetId: 7249
      revision: 1
      datasource: Prometheus
    node-exporter:
      gnetId: 1860
      revision: 37
      datasource: Prometheus
    kubernetes-pods:
      gnetId: 6336
      revision: 1
      datasource: Prometheus
    loki-logs:
      gnetId: 13639
      revision: 2
      datasource: Loki

## ── Node Tolerations (deploy on system nodes) ────────────────────────────────
tolerations:
  - key: dedicated
    operator: Equal
    value: system
    effect: NoSchedule

nodeSelector:
  role: system
