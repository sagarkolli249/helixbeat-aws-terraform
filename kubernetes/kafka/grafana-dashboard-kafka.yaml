###############################################################################
# Grafana Dashboard ConfigMap for Kafka (auto-discovered by Grafana sidecar)
# Uses the official Strimzi Kafka dashboard (gnetId: 7589)
###############################################################################
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: grafana-dashboard-kafka
  namespace: monitoring
  labels:
    grafana_dashboard: "1"
    grafana_folder: "Kafka"
data:
  kafka-dashboard.json: |
    {
      "__inputs": [{ "name": "DS_PROMETHEUS", "type": "datasource", "pluginId": "prometheus" }],
      "__requires": [{ "type": "datasource", "id": "prometheus", "version": "1.0.0" }],
      "title": "Kafka Overview – HelixBeat",
      "uid": "helixbeat-kafka",
      "tags": ["kafka", "strimzi", "helixbeat"],
      "templating": {
        "list": [
          {
            "name": "namespace",
            "type": "query",
            "query": "label_values(kafka_server_replicamanager_leadercount, namespace)",
            "current": { "value": "kafka" }
          },
          {
            "name": "cluster",
            "type": "query",
            "query": "label_values(kafka_server_replicamanager_leadercount{namespace=\"$namespace\"}, strimzi_io_cluster)"
          }
        ]
      },
      "panels": [
        {
          "title": "Brokers Online",
          "type": "stat",
          "targets": [{
            "expr": "count(kafka_server_replicamanager_leadercount{namespace=\"$namespace\"}) by (strimzi_io_cluster)",
            "legendFormat": "Brokers"
          }]
        },
        {
          "title": "Under-Replicated Partitions",
          "type": "stat",
          "targets": [{
            "expr": "sum(kafka_server_replicamanager_underreplicatedpartitions{namespace=\"$namespace\"})",
            "legendFormat": "Under-Replicated"
          }],
          "thresholds": { "steps": [{"color":"green","value":0},{"color":"red","value":1}] }
        },
        {
          "title": "Messages In/sec",
          "type": "timeseries",
          "targets": [{
            "expr": "sum(rate(kafka_server_brokertopicmetrics_messagesin_total{namespace=\"$namespace\"}[5m])) by (topic)",
            "legendFormat": "{{topic}}"
          }]
        },
        {
          "title": "Consumer Group Lag",
          "type": "timeseries",
          "targets": [{
            "expr": "sum(kafka_consumergroup_lag{namespace=\"$namespace\"}) by (consumergroup, topic)",
            "legendFormat": "{{consumergroup}} / {{topic}}"
          }]
        }
      ],
      "schemaVersion": 38,
      "version": 1
    }
