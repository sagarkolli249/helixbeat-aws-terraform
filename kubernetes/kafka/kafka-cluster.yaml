###############################################################################
# HelixBeat – Kafka Cluster (Strimzi)
# Replaces: Amazon MSK
# Topology:
#   • 3 Kafka brokers (one per AZ, matching MSK RF=3 pattern)
#   • 3 ZooKeeper nodes (HA coordination)
#   • TLS encryption in-transit (cluster + client)
#   • SCRAM-SHA-512 authentication (replicates MSK SASL/SCRAM)
#   • gp3 EBS PVCs for broker storage (KMS encrypted)
#   • Internal + external listeners
#   • Cruise Control for partition rebalancing
###############################################################################

---
# ─────────────────────────────────────────────────────────────────────────────
# Kafka Cluster
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: Kafka
metadata:
  name: helixbeat
  namespace: kafka
  labels:
    app.kubernetes.io/name: kafka
    app.kubernetes.io/part-of: helixbeat
spec:
  kafka:
    version: 3.7.0
    replicas: 3

    # ── Listeners ─────────────────────────────────────────────────────────────
    listeners:
      # Internal listener – plain within cluster (pod-to-pod)
      - name: plain
        port: 9092
        type: internal
        tls: false

      # Internal TLS listener – for applications with TLS client auth
      - name: tls
        port: 9093
        type: internal
        tls: true
        authentication:
          type: scram-sha-512

      # Internal SCRAM listener (primary app listener)
      - name: external
        port: 9094
        type: internal   # ClusterIP – not exposed outside VPC
        tls: true
        authentication:
          type: scram-sha-512

    # ── Authorization ─────────────────────────────────────────────────────────
    authorization:
      type: simple
      superUsers:
        - User:admin

    # ── Storage – gp3 EBS, one per broker ─────────────────────────────────────
    storage:
      type: jbod
      volumes:
        - id: 0
          type: persistent-claim
          size: 500Gi
          class: gp3
          deleteClaim: false

    # ── Configuration (mirrors MSK defaults + hardening) ─────────────────────
    config:
      # Replication & durability
      default.replication.factor: 3
      min.insync.replicas: 2
      offsets.topic.replication.factor: 3
      transaction.state.log.replication.factor: 3
      transaction.state.log.min.isr: 2

      # Performance
      num.network.threads: 8
      num.io.threads: 16
      socket.send.buffer.bytes: 102400
      socket.receive.buffer.bytes: 102400
      socket.request.max.bytes: 104857600
      num.partitions: 6
      num.recovery.threads.per.data.dir: 2

      # Log retention (31 days – matches MSK default)
      log.retention.hours: 744
      log.retention.bytes: -1
      log.segment.bytes: 1073741824
      log.roll.hours: 168

      # Security
      ssl.client.auth: none
      inter.broker.protocol.version: "3.7"
      log.message.format.version: "3.7"

      # Auto-create topics disabled (explicit topic management via KafkaTopic CRDs)
      auto.create.topics.enable: "false"
      delete.topic.enable: "true"

    # ── Resources ─────────────────────────────────────────────────────────────
    resources:
      requests:
        cpu: 500m
        memory: 2Gi
      limits:
        cpu: 2000m
        memory: 4Gi

    # ── JVM ───────────────────────────────────────────────────────────────────
    jvmOptions:
      -Xms: 1g
      -Xmx: 2g
      gcLoggingEnabled: true

    # ── Pod scheduling – spread across AZs ──────────────────────────────────
    template:
      pod:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: kafka
        tolerations:
          - key: dedicated
            operator: Equal
            value: system
            effect: NoSchedule
        affinity:
          nodeAffinity:
            requiredDuringSchedulingIgnoredDuringExecution:
              nodeSelectorTerms:
                - matchExpressions:
                    - key: role
                      operator: In
                      values: [system]

    # ── Metrics (Prometheus) ─────────────────────────────────────────────────
    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: kafka-metrics-config.yml

    # ── Rack awareness (maps to AZ for RF placement) ─────────────────────────
    rack:
      topologyKey: topology.kubernetes.io/zone

  # ─────────────────────────────────────────────────────────────────────────────
  # ZooKeeper (HA coordination)
  # ─────────────────────────────────────────────────────────────────────────────
  zookeeper:
    replicas: 3

    storage:
      type: persistent-claim
      size: 20Gi
      class: gp3
      deleteClaim: false

    resources:
      requests:
        cpu: 200m
        memory: 512Mi
      limits:
        cpu: 500m
        memory: 1Gi

    jvmOptions:
      -Xms: 512m
      -Xmx: 512m

    template:
      pod:
        securityContext:
          runAsNonRoot: true
          seccompProfile:
            type: RuntimeDefault
        topologySpreadConstraints:
          - maxSkew: 1
            topologyKey: topology.kubernetes.io/zone
            whenUnsatisfiable: DoNotSchedule
            labelSelector:
              matchLabels:
                app.kubernetes.io/name: zookeeper

    metricsConfig:
      type: jmxPrometheusExporter
      valueFrom:
        configMapKeyRef:
          name: kafka-metrics
          key: zookeeper-metrics-config.yml

  # ─────────────────────────────────────────────────────────────────────────────
  # Entity Operator (manages KafkaTopic + KafkaUser CRDs)
  # ─────────────────────────────────────────────────────────────────────────────
  entityOperator:
    topicOperator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi
    userOperator:
      resources:
        requests:
          cpu: 100m
          memory: 128Mi
        limits:
          cpu: 200m
          memory: 256Mi

  # ─────────────────────────────────────────────────────────────────────────────
  # Cruise Control (partition rebalancing – replicates MSK auto-rebalancing)
  # ─────────────────────────────────────────────────────────────────────────────
  cruiseControl:
    resources:
      requests:
        cpu: 200m
        memory: 256Mi
      limits:
        cpu: 500m
        memory: 512Mi

  # ─────────────────────────────────────────────────────────────────────────────
  # Kafka Exporter (Prometheus consumer group lag metrics)
  # ─────────────────────────────────────────────────────────────────────────────
  kafkaExporter:
    topicRegex: ".*"
    groupRegex: ".*"
    resources:
      requests:
        cpu: 100m
        memory: 64Mi
      limits:
        cpu: 200m
        memory: 128Mi

---
# ─────────────────────────────────────────────────────────────────────────────
# Prometheus metrics ConfigMap
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: v1
kind: ConfigMap
metadata:
  name: kafka-metrics
  namespace: kafka
data:
  kafka-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), topic=(.+), partition=(.*)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
          topic: "$4"
          partition: "$5"
      - pattern: kafka.server<type=(.+), name=(.+), clientId=(.+), brokerHost=(.+), brokerPort=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
        labels:
          clientId: "$3"
          broker: "$4:$5"
      - pattern: kafka.server<type=(.+), name=(.+)><>OneMinuteRate
        name: kafka_server_$1_$2_rate
        type: GAUGE
      - pattern: kafka.server<type=(.+), name=(.+)><>Value
        name: kafka_server_$1_$2
        type: GAUGE
      - pattern: kafka.network<type=(.+), name=(.+)><>Value
        name: kafka_network_$1_$2
        type: GAUGE
      - pattern: kafka.log<type=(.+), name=(.+)><>Value
        name: kafka_log_$1_$2
        type: GAUGE

  zookeeper-metrics-config.yml: |
    lowercaseOutputName: true
    rules:
      - pattern: "org.apache.ZooKeeperService<name0=ReplicatedServer_id(\\d+)><>(\\w+)"
        name: "zookeeper_$2"
        type: GAUGE
      - pattern: "org.apache.ZooKeeperService<name0=ReplicatedServer_id(\\d+), name1=replica.(\\d+)><>(\\w+)"
        name: "zookeeper_$3"
        labels:
          replicaId: "$2"
        type: GAUGE

---
# ─────────────────────────────────────────────────────────────────────────────
# Kafka Admin User (SCRAM-SHA-512)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: admin
  namespace: kafka
  labels:
    strimzi.io/cluster: helixbeat
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      - resource:
          type: cluster
        operation: All

---
# ─────────────────────────────────────────────────────────────────────────────
# Application User (limited ACLs)
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaUser
metadata:
  name: helixbeat-app
  namespace: kafka
  labels:
    strimzi.io/cluster: helixbeat
spec:
  authentication:
    type: scram-sha-512
  authorization:
    type: simple
    acls:
      # Produce to helixbeat.* topics
      - resource:
          type: topic
          name: helixbeat.
          patternType: prefix
        operation: Write
      - resource:
          type: topic
          name: helixbeat.
          patternType: prefix
        operation: Describe
      # Consume from helixbeat.* topics
      - resource:
          type: topic
          name: helixbeat.
          patternType: prefix
        operation: Read
      - resource:
          type: group
          name: helixbeat-
          patternType: prefix
        operation: Read
      # Transactions
      - resource:
          type: transactionalId
          name: helixbeat-
          patternType: prefix
        operation: Write

---
# ─────────────────────────────────────────────────────────────────────────────
# Sample Topics
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: helixbeat-events
  namespace: kafka
  labels:
    strimzi.io/cluster: helixbeat
spec:
  partitions: 12
  replicas: 3
  config:
    retention.ms: "2592000000"     # 30 days
    min.insync.replicas: "2"
    cleanup.policy: delete
    compression.type: lz4

---
apiVersion: kafka.strimzi.io/v1beta2
kind: KafkaTopic
metadata:
  name: helixbeat-audit
  namespace: kafka
  labels:
    strimzi.io/cluster: helixbeat
spec:
  partitions: 6
  replicas: 3
  config:
    retention.ms: "2592000000"     # 30 days
    min.insync.replicas: "2"
    cleanup.policy: delete

---
# ─────────────────────────────────────────────────────────────────────────────
# PodMonitor – Prometheus scrape for Kafka + ZooKeeper + Exporter
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: kafka-resources-metrics
  namespace: kafka
  labels:
    release: kube-prometheus-stack
spec:
  selector:
    matchExpressions:
      - key: "strimzi.io/kind"
        operator: In
        values: ["Kafka", "KafkaConnect", "KafkaMirrorMaker", "KafkaBridge"]
  namespaceSelector:
    matchNames: [kafka]
  podMetricsEndpoints:
    - path: /metrics
      port: tcp-prometheus

---
# ─────────────────────────────────────────────────────────────────────────────
# NetworkPolicy – Kafka namespace
# ─────────────────────────────────────────────────────────────────────────────
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: kafka-default-deny
  namespace: kafka
spec:
  podSelector: {}
  policyTypes:
    - Ingress

---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-app-to-kafka
  namespace: kafka
spec:
  podSelector:
    matchLabels:
      strimzi.io/cluster: helixbeat
  policyTypes:
    - Ingress
  ingress:
    # Allow from application namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: default
        - namespaceSelector:
            matchLabels:
              name: app
      ports:
        - port: 9092
          protocol: TCP
        - port: 9093
          protocol: TCP
        - port: 9094
          protocol: TCP
    # Allow Prometheus scrape from monitoring namespace
    - from:
        - namespaceSelector:
            matchLabels:
              name: monitoring
      ports:
        - port: 9404
          protocol: TCP
    # Allow internal Kafka broker communication
    - from:
        - podSelector:
            matchLabels:
              strimzi.io/cluster: helixbeat
